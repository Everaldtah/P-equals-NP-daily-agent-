# Runs the P vs NP agent on GitHub's free hosted runners, once every 5 hours, whether or not
# your own computer is on. Usage cap: one run per 5-hour window, a time box (AGENT.md) and a turn limit.
name: pnp-agent

on:
  schedule:
    - cron: "17 */5 * * *"   # 00:17, 05:17, 10:17, 15:17, 20:17 UTC
  workflow_dispatch: {}      # "Run workflow" button for a manual run

concurrency:
  group: pnp-agent
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 130
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space for Mathlib
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /

      - name: Install Claude Code and Lean (elan)
        run: |
          npm install -g @anthropic-ai/claude-code
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Configure git identity and gh
        env:
          GH_TOKEN: ${{ secrets.PNP_GH_TOKEN }}
        run: |
          git config --global user.name "Everaldtah"
          git config --global user.email "105641141+Everaldtah@users.noreply.github.com"
          gh auth setup-git
          gh api user --jq .login

      - name: Run the agent
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GH_TOKEN: ${{ secrets.PNP_GH_TOKEN }}
        run: |
          mkdir -p logs/transcripts
          T="logs/transcripts/$(date -u +%Y-%m-%dT%H%MZ).jsonl"
          echo "TRANSCRIPT=$T" >> "$GITHUB_ENV"
          PROMPT="You are running unattended in a GitHub Actions job in the repository checkout (the current directory).
          Follow AGENT.md exactly. Today is $(date -u +%Y-%m-%d). Clone the fork into ../pequalnp-proofs (outside this repo);
          create it first with 'gh repo fork open-goat/pequalnp-proofs --clone=false' if it does not exist. Prefer the
          script tools/pnp.sh in the fork (setup, next, beat, check, submit, release). Write logs/ and proofs/ in THIS
          repository but do not commit or push it: the workflow commits and pushes it after you finish.
          Never print, echo, log or commit any token or environment variable value."
          timeout 115m claude -p "$PROMPT" \
            --model claude-opus-5-5 \
            --max-turns 200 \
            --dangerously-skip-permissions \
            --output-format stream-json --verbose > "$T" || echo "agent exited with $?"

      - name: Scrub secrets and push logs
        if: always()
        env:
          S1: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          S2: ${{ secrets.PNP_GH_TOKEN }}
        run: |
          python3 - <<'PY'
          import os, pathlib
          secrets = [os.environ.get(k) for k in ("S1", "S2")]
          for p in pathlib.Path(".").rglob("*"):
              if p.is_file() and ".git" not in p.parts and p.parts[0] in ("logs", "proofs"):
                  t = p.read_text(errors="ignore")
                  u = t
                  for s in secrets:
                      if s: u = u.replace(s, "[REDACTED]")
                  if u != t: p.write_text(u)
          PY
          git add logs proofs || true
          git commit -q -m "Agent run $(date -u +%Y-%m-%dT%H:%MZ): logs and transcript" || true
          git pull -q --rebase origin "${GITHUB_REF_NAME}" || true
          git push -q origin "HEAD:${GITHUB_REF_NAME}"
