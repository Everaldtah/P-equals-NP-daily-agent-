# Runs the P vs NP agent on GitHub's free hosted runners, once every 5 hours, whether or not
# your own computer is on. Usage cap: one run per 5-hour window, a time box (AGENT.md) and a turn limit.
#
# Why hourly ticks: GitHub delays scheduled runs under load and sometimes drops them entirely, so a
# single "every 5 hours" cron can silently miss a whole window. The schedule ticks every hour, and the
# small `gate` job (about 10 seconds) lets a tick through only when the last agent run started at least
# MIN_GAP_MINUTES ago (logs/LAST_RUN). A dropped tick then costs one hour, not five.
name: pnp-agent

on:
  schedule:
    - cron: "17 * * * *"     # every hour at :17; the gate turns this into one run per ~5 hours
  workflow_dispatch:         # "Run workflow" button for a manual run
    inputs:
      force:
        description: "Run now even if the last run was less than 5 hours ago"
        type: boolean
        default: true

concurrency:
  group: pnp-agent
  cancel-in-progress: false

permissions:
  contents: write

env:
  MIN_GAP_MINUTES: "280"     # 4 h 40 min: with hourly ticks, one run per 5-hour window

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      go: ${{ steps.check.outputs.go }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          FORCE: ${{ inputs.force }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ] && [ "$FORCE" = "true" ]; then
            echo "Manual run with force: no gate."; echo "go=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # Read LAST_RUN from the branch as it is now, not from the commit this tick was queued on.
          if raw=$(gh api "repos/$REPO/contents/logs/LAST_RUN?ref=$BRANCH" -H "Accept: application/vnd.github.raw" 2>/dev/null); then
            last=$(printf '%s' "$raw" | tr -dc '0-9')
          else
            last=""
          fi
          now=$(date +%s)
          if [ -z "$last" ]; then
            echo "No logs/LAST_RUN yet: run."; echo "go=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          age=$(( (now - last) / 60 ))
          if [ "$age" -ge "$MIN_GAP_MINUTES" ]; then
            echo "Last run started $age min ago (>= $MIN_GAP_MINUTES): run."; echo "go=true" >> "$GITHUB_OUTPUT"
          else
            echo "Last run started $age min ago (< $MIN_GAP_MINUTES): skip this tick."; echo "go=false" >> "$GITHUB_OUTPUT"
          fi

  run:
    needs: gate
    if: needs.gate.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 130     # keep above TIME_BOX_MINUTES + 45
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}   # branch head, so this run sees the last run's logs and notes

      - name: Record the start time
        run: mkdir -p logs && date +%s > logs/LAST_RUN

      - name: Free disk space for Mathlib
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /

      - name: Install Claude Code, Lean (elan) and search tools
        run: |
          npm install -g @anthropic-ai/claude-code
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          # SAT/SMT solvers for finding circuits and witnesses (the Lean file is still what gets checked).
          if python3 -m venv "$HOME/pnp-py"; then
            "$HOME/pnp-py/bin/pip" install -q z3-solver || echo "::warning::z3-solver did not install"
            "$HOME/pnp-py/bin/pip" install -q python-sat || echo "::warning::python-sat did not install"
            echo "$HOME/pnp-py/bin" >> "$GITHUB_PATH"
          else
            echo "::warning::python venv unavailable; running without solvers"
          fi

      - name: Configure git identity and gh
        env:
          GH_TOKEN: ${{ secrets.PNP_GH_TOKEN }}
        run: |
          git config --global user.name "Everaldtah"
          git config --global user.email "105641141+Everaldtah@users.noreply.github.com"
          gh auth setup-git
          gh api user --jq .login

      - name: Run the agent
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GH_TOKEN: ${{ secrets.PNP_GH_TOKEN }}
        run: |
          mkdir -p logs/transcripts
          T="logs/transcripts/$(date -u +%Y-%m-%dT%H%MZ).jsonl"
          echo "TRANSCRIPT=$T" >> "$GITHUB_ENV"
          TB=$(grep -oE 'TIME_BOX_MINUTES:[[:space:]]*[0-9]+' AGENT.md | grep -oE '[0-9]+$' || true)
          TB=${TB:-60}
          DEADLINE=$(( $(date +%s) + TB * 60 ))
          END_UTC=$(date -u -d "@$DEADLINE" +%H:%MZ)
          echo "Time box: $TB minutes, ends at $END_UTC"
          FLAGS=(--model claude-opus-5-5 --max-turns 200 --dangerously-skip-permissions --output-format stream-json --verbose)
          PROMPT="You are running unattended in a GitHub Actions job in the repository checkout (the current directory).
          Follow AGENT.md exactly. Today is $(date -u +%Y-%m-%d). Your time box is $TB minutes and ends at $END_UTC
          (UTC). Run 'date -u' before every new step and every few tool calls: you cannot judge elapsed time
          without it. Use the whole time box: never sit idle, give a hard step at least 20 minutes, and after
          you submit or release a step take the next one while 15 minutes or more remain. Ten minutes before
          the end, release whatever you hold with an honest reason and write the logs.
          Read NOTES.md first: it holds what earlier runs learned. Before you finish, update NOTES.md with
          anything the next run should know (keep it short). Do not save memories under ~/.claude: this
          runner is wiped after the job, only files in this repository survive.
          Clone the fork into ../pequalnp-proofs (outside this repo); create it first with
          'gh repo fork open-goat/pequalnp-proofs --clone=false' if it does not exist. Prefer the script
          tools/pnp.sh in the fork (setup, next, beat, check, submit, release). python3 has z3 and pysat
          if you need a search. Write logs/, proofs/, tools/ (reusable search programs) and NOTES.md in THIS repository but do not commit or
          push it: the workflow commits and pushes it after you finish.
          Never print, echo, log or commit any token or environment variable value."
          s0=$(date +%s)
          timeout "$(( TB + 15 ))m" claude -p "$PROMPT" "${FLAGS[@]}" > "$T" || echo "agent exited with $?"
          # If the agent stops early, resume the same conversation until the time box is used.
          for i in 2 3 4; do
            now=$(date +%s); left=$(( (DEADLINE - now) / 60 ))
            [ "$left" -ge 15 ] || break
            if [ $(( now - s0 )) -lt 120 ]; then echo "::warning::last session ended within 2 minutes; not resuming"; break; fi
            echo "Agent stopped with $left minutes left; resuming (session $i)"
            s0=$now
            timeout "$(( left + 15 ))m" claude -p --continue "You stopped with $left minutes left in the time box, which ends at $END_UTC. Keep working as AGENT.md and join.txt say: take the next step now (tools/pnp.sh next), work on it, log it in logs/, and stop only near $END_UTC. Do not commit or push." "${FLAGS[@]}" >> "$T" || echo "agent exited with $?"
          done

      - name: Scrub secrets and push logs
        if: always()
        env:
          S1: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          S2: ${{ secrets.PNP_GH_TOKEN }}
        run: |
          python3 - <<'PY'
          import os, pathlib
          secrets = [os.environ.get(k) for k in ("S1", "S2")]
          for p in pathlib.Path(".").rglob("*"):
              if p.is_file() and ".git" not in p.parts and (p.parts[0] in ("logs", "proofs", "tools") or str(p) == "NOTES.md"):
                  t = p.read_text(errors="ignore")
                  u = t
                  for s in secrets:
                      if s: u = u.replace(s, "[REDACTED]")
                  if u != t: p.write_text(u)
          PY
          git add -A logs proofs
          if [ -d tools ]; then git add -A tools; fi
          if [ -e NOTES.md ] || git ls-files --error-unmatch NOTES.md >/dev/null 2>&1; then git add -A NOTES.md; fi
          git commit -q -m "Agent run $(date -u +%Y-%m-%dT%H:%MZ): logs and transcript" || true
          git pull -q --rebase origin "${GITHUB_REF_NAME}" || true
          git push -q origin "HEAD:${GITHUB_REF_NAME}"

      - name: Check the agent's result
        if: always()
        run: |
          python3 - <<'PY'
          import json, os
          path = os.environ.get("TRANSCRIPT", "")
          results = []
          if path and os.path.exists(path):
              for line in open(path, encoding="utf-8", errors="ignore"):
                  try:
                      d = json.loads(line)
                  except ValueError:
                      continue
                  if d.get("type") == "result":
                      results.append(d)
          rows = ["| session | outcome | turns | minutes |", "|---|---|---|---|"]
          for i, r in enumerate(results, 1):
              rows.append(f"| {i} | {r.get('subtype')}{' (error)' if r.get('is_error') else ''} | {r.get('num_turns')} | {round((r.get('duration_ms') or 0) / 60000, 1)} |")
          text = "\n".join(rows) + "\n\n" + (str(results[-1].get("result") or "")[:4000] if results else "No result from the agent.")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as f:
              f.write("## Agent run\n\n" + text + "\n")
          print(text)
          if not any(not r.get("is_error") for r in results):
              print("::error::No agent session finished successfully. Check the transcript (an expired CLAUDE_CODE_OAUTH_TOKEN looks like this).")
              raise SystemExit(1)
          PY
